name: Merge Jild 14 tashreeh
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge chunks
        run: python3 merge_jild14.py
      - name: Verify merged file
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('jild-14.json', encoding='utf-8'))
          items = d['masail']
          pages = set()
          for it in items:
              pages.update(it['pages'])
          print('items:', len(items))
          print('unique pages:', len(pages), 'min:', min(pages), 'max:', max(pages))
          print('ids unique:', len(set(it['id'] for it in items)) == len(items))
          print('empty jawab:', sum(1 for it in items if not it.get('tashreeh_jawab')))
          print('with sawal:', sum(1 for it in items if it.get('tashreeh_sawal')))
          print('volume_ids:', sorted(set(it.get('volume_id') for it in items)))
          print('start_page==min(pages) all:', all(it.get('start_page') == min(it['pages']) for it in items))
          combined = {
              'jild14-masala-24': list(range(174, 240)),
              'jild14-masala-130': [382, 383],
              'jild14-masala-183': [p for p in range(427, 546) if p != 503],
              'jild14-masala-205': [581, 582, 583],
              'jild14-masala-258': list(range(626, 637)),
          }
          for cid, expected_pages in combined.items():
              hits = [it for it in items if it['id'] == cid]
              print(cid, 'items:', len(hits), 'pages:', hits[0]['pages'][0], '-', hits[0]['pages'][-1], f'({len(hits[0]["pages"])} pages)' if hits else None)
              assert len(hits) == 1
              assert hits[0]['pages'] == expected_pages, f'{cid}: pages mismatch'
          # absorbed section ids must be gone
          absorbed = ['jild14-p197', 'jild14-p199', 'jild14-p203', 'jild14-p207',
                      'jild14-p212', 'jild14-dawam-taghallub-ikhtiyar',
                      'jild14-dawam-27-35', 'jild14-dawam-fasl3-mabhas1',
                      'jild14-dawam-fasl3-mabhas2',
                      'jild14-p458', 'jild14-p459', 'jild14-tanbih-3', 'jild14-p465',
                      'jild14-p466-suluk', 'jild14-p466-mawalat', 'jild14-p470',
                      'jild14-tanbih-4', 'jild14-p473', 'jild14-p474', 'jild14-p477',
                      'jild14-p478-angrez', 'jild14-p480', 'jild14-p481', 'jild14-p482',
                      'jild14-aman-sharaait', 'jild14-radd-6-muhaida',
                      'jild14-radd-7-mazalim', 'jild14-aghraz-muakhawat-ittihad',
                      'jild14-hilf-mushrikin', 'jild14-self-government',
                      'jild14-faida-1-ayat', 'jild14-faida-2-ahadith',
                      'jild14-faida-3-riwayat', 'jild14-faida-4-zimmi',
                      'jild14-faida-5-kitabi', 'jild14-faida-6-aqsam',
                      'jild14-istikhdam-suwar', 'jild14-faida-7-tabdeel',
                      'jild14-hidayat-muftiyan', 'jild14-dukhul-masajid',
                      'jild14-sabia-masajid', 'jild14-khulasa-wa-arz',
                      'jild14-tark-muamalat',
                      'jild14-p533', 'jild14-p536', 'jild14-p538', 'jild14-p541']
          for sid in absorbed:
              assert not any(it['id'] == sid for it in items), f'{sid} should have been combined away'
          print(f'{len(absorbed)} absorbed section ids gone')
          # distinct items kept separate
          for did in ['jild14-p271', 'jild14-p692', 'jild14-p597', 'jild14-p712']:
              assert any(it['id'] == did for it in items), f'missing distinct item {did}'
              print(did, 'present')
          assert len(items) == 200
          assert len(pages) == 614
          assert min(pages) == 6 and max(pages) == 712
          assert len(set(it['id'] for it in items)) == len(items)
          assert all(it.get('tashreeh_jawab') for it in items)
          print('VERIFICATION PASSED')
          EOF
      - name: Create release with merged file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la jild-14.json
          gh release create v1.0 jild-14.json --title "Jild 14 tashreeh - merged" --notes "Merged tashreeh for Fatawa Razviya Jild 14: 200 items, 614 pages (volume_id 57). Generated by merge_jild14.py from the 16 chunk files; 5 combine cases (masala-24 ten-way, masala-130, masala-183 forty-way, masala-205, masala-258)." || gh release upload v1.0 jild-14.json --clobber
